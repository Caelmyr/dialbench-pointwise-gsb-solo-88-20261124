name: solo91-dialbench
services:
  desk:
    build:
      context: .
      args:
        DIALBENCH_RUNTIME_IMAGE: ${DIALBENCH_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${DIALBENCH_IMAGE:-solo91-dialbench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${DIALBENCH_PORT:-19891}:8000"
    volumes:
      - dial-data:/var/lib/dialbench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/dial/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  dial-data:
